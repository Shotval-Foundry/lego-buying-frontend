<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>採購小幫手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #F2EFE8;
    --panel: #FFFFFF;
    --ink: #22201C;
    --ink-soft: #6B655C;
    --line: #DEDACF;
    --brick: #C23B32;
    --brick-dark: #9E2E27;
    --stud: #E8B93B;
    --ok-bg: #EEF3EA;
    --ok-ink: #4C6E3F;
    --warn-bg: #FBF0E2;
    --warn-ink: #96601A;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    line-height: 1.5;
  }

  .wrap { max-width: 760px; margin: 0 auto; padding: 40px 20px 80px; }

  header.page-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 8px;
  }

  h1 {
    font-family: 'Archivo', sans-serif;
    font-weight: 800;
    font-size: 26px;
    letter-spacing: -0.02em;
    margin: 0;
  }
  h1 .dot { color: var(--brick); }

  .ext-status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 20px;
    background: var(--panel);
    border: 1px solid var(--line);
  }
  .ext-status.ok { color: var(--ok-ink); background: var(--ok-bg); border-color: transparent; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 20px;
  }

  .panel h2 {
    font-family: 'Archivo', sans-serif;
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 16px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
  }

  label.field-label {
    display: block;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 4px;
    font-weight: 500;
  }

  input[type="text"], input[type="password"], textarea {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #FCFBF8;
    color: var(--ink);
  }
  textarea { font-family: 'JetBrains Mono', monospace; font-size: 13px; min-height: 120px; resize: vertical; }
  input:focus, textarea:focus { outline: 2px solid var(--brick); outline-offset: 1px; }

  .row { display: flex; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 160px; }

  button {
    font-family: 'Archivo', sans-serif;
    font-weight: 700;
    font-size: 14px;
    padding: 11px 20px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    letter-spacing: 0.01em;
  }
  .btn-primary { background: var(--brick); color: white; }
  .btn-primary:hover { background: var(--brick-dark); }
  .btn-primary:disabled { background: #C9C2B4; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
  .btn-ghost:hover { border-color: var(--ink-soft); }

  .error-msg { color: var(--brick-dark); font-size: 13px; margin-top: 10px; }
  .status-msg { color: var(--ink-soft); font-size: 13px; margin: 14px 0; }

  .user-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .user-bar strong { color: var(--ink); font-family: 'JetBrains Mono', monospace; }

  #appBox { display: none; }

  /* ---- 結果區：包裹卡片 ---- */
  .grand-summary {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--ink);
    color: white;
    border-radius: 14px;
    padding: 20px 24px;
    margin: 28px 0 20px;
  }
  .grand-summary .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.6; }
  .grand-summary .amount { font-family: 'JetBrains Mono', monospace; font-size: 30px; font-weight: 600; }
  .grand-summary .meta { font-size: 12px; opacity: 0.7; margin-top: 2px; }

  .crate {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .crate-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px;
    background: repeating-linear-gradient(135deg, #FAF8F3, #FAF8F3 10px, #F4F1EA 10px, #F4F1EA 20px);
    border-bottom: 1px dashed var(--line);
  }
  .crate-head .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    background: var(--stud);
    color: #4A3B0E;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 600;
  }
  .crate-head .seller {
    font-family: 'Archivo', sans-serif;
    font-weight: 700;
    font-size: 15px;
    margin-top: 4px;
  }

  .crate-items { padding: 4px 20px; }
  .item-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid #F0EDE5;
  }
  .item-row:last-child { border-bottom: none; }
  .item-main { flex: 1; min-width: 0; }
  .item-part {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    background: #F0EDE5;
    display: inline-block;
    padding: 1px 6px;
    border-radius: 4px;
    margin-bottom: 4px;
  }
  .item-title {
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .item-title a { color: var(--ink); text-decoration: none; }
  .item-title a:hover { color: var(--brick); text-decoration: underline; }
  .item-qty { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .item-price {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 14px;
    white-space: nowrap;
  }

  .crate-foot {
    display: flex;
    justify-content: space-between;
    padding: 12px 20px;
    background: #FAF8F3;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }
  .crate-foot .total { font-weight: 700; font-size: 15px; }
  .crate-foot .breakdown { color: var(--ink-soft); }

  .banner {
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13px;
    margin-bottom: 14px;
  }
  .banner.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .banner.short { background: #FBEAE8; color: var(--brick-dark); }

  details.raw-json { margin-top: 20px; font-size: 12px; color: var(--ink-soft); }
  details.raw-json pre {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
    overflow-x: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    white-space: pre-wrap;
  }

  .empty-state { text-align: center; color: var(--ink-soft); padding: 30px 0; font-size: 13px; }

  /* ---- 輸入模式切換 ---- */
  .mode-switch {
    display: inline-flex;
    background: #F0EDE5;
    border-radius: 8px;
    padding: 3px;
    margin-bottom: 18px;
  }
  .mode-switch button {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    padding: 7px 16px;
    border-radius: 6px;
    background: transparent;
    color: var(--ink-soft);
  }
  .mode-switch button.active { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }

  .mode-panel { display: none; }
  .mode-panel.active { display: block; }

  /* ---- 手動輸入表格 ---- */
  table.parts-table { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
  table.parts-table th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
    padding: 0 8px 8px;
    font-weight: 600;
  }
  table.parts-table td { padding: 4px; }
  table.parts-table input {
    width: 100%;
    padding: 8px 10px;
    font-size: 13px;
  }
  table.parts-table td.qty-cell input { text-align: center; }
  table.parts-table td.del-cell { width: 36px; text-align: center; }
  .row-del-btn {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 16px;
    cursor: pointer;
    padding: 4px 8px;
  }
  .row-del-btn:hover { color: var(--brick); }

  .add-row-btn {
    background: transparent;
    border: 1px dashed var(--line);
    color: var(--ink-soft);
    width: 100%;
    padding: 10px;
    font-weight: 500;
    margin-bottom: 16px;
  }
  .add-row-btn:hover { border-color: var(--ink-soft); color: var(--ink); }

  /* ---- Excel 上傳 ---- */
  .drop-zone {
    border: 2px dashed var(--line);
    border-radius: 10px;
    padding: 30px 20px;
    text-align: center;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 13px;
    margin-bottom: 16px;
    transition: border-color 0.15s, background 0.15s;
  }
  .drop-zone:hover, .drop-zone.dragover { border-color: var(--brick); background: #FBF3F1; }
  .drop-zone strong { color: var(--ink); }
  .drop-zone input[type="file"] { display: none; }

  .preview-table-wrap { max-height: 260px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; }
  table.preview-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.preview-table th {
    position: sticky; top: 0;
    background: #F7F5F0;
    text-align: left;
    padding: 8px 12px;
    font-size: 11px;
    text-transform: uppercase;
    color: var(--ink-soft);
    border-bottom: 1px solid var(--line);
  }
  table.preview-table td { padding: 7px 12px; border-bottom: 1px solid #F0EDE5; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  table.preview-table tr:last-child td { border-bottom: none; }

  .file-summary { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 10px; }
  .file-summary .fname { font-weight: 600; }
  .clear-file-btn { background: none; border: none; color: var(--ink-soft); text-decoration: underline; cursor: pointer; font-size: 12px; padding: 0; }

  .or-divider {
    display: flex;
    align-items: center;
    text-align: center;
    color: var(--ink-soft);
    font-size: 12px;
    margin: 20px 0;
  }
  .or-divider::before, .or-divider::after {
    content: '';
    flex: 1;
    border-bottom: 1px solid var(--line);
  }
  .or-divider span { padding: 0 12px; }
</style>
</head>
<body>

<div class="wrap">

  <header class="page-head">
    <h1>採購小幫手<span class="dot">.</span></h1>
    <span class="ext-status" id="extStatus">擴充功能：尚未偵測到</span>
  </header>

  <!-- 登入區塊 -->
  <div class="panel" id="loginBox">
    <h2>登入</h2>
    <div class="row">
      <div>
        <label class="field-label" for="usernameInput">帳號</label>
        <input type="text" id="usernameInput" autocomplete="username">
      </div>
      <div>
        <label class="field-label" for="passwordInput">密碼</label>
        <input type="password" id="passwordInput" autocomplete="current-password">
      </div>
    </div>
    <button class="btn-primary" id="loginBtn">登入</button>
    <div class="error-msg" id="loginError"></div>
  </div>

  <!-- 登入後主功能區 -->
  <div id="appBox">
    <div class="user-bar">
      <div>登入身分：<strong id="userNameLabel"></strong></div>
      <button class="btn-ghost" id="logoutBtn">登出</button>
    </div>

    <div class="panel">
      <h2>零件清單</h2>

      <label class="field-label">手動輸入</label>
      <table class="parts-table">
        <thead>
          <tr>
            <th style="width:32%">零件編號</th>
            <th style="width:32%">顏色</th>
            <th style="width:20%">數量</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="manualRows"></tbody>
      </table>
      <button class="add-row-btn" id="addRowBtn">+ 新增一列</button>

      <div class="or-divider"><span>或</span></div>

      <label class="field-label">上傳 Excel / CSV（若已上傳檔案，將以檔案內容為準，忽略上方手動輸入）</label>
      <div class="drop-zone" id="dropZone">
        <div><strong>點擊選擇檔案</strong>，或將 Excel / CSV 拖曳到這裡</div>
        <div style="margin-top:4px; font-size:12px;">需包含欄位：零件編號、數量、顏色</div>
        <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
      </div>
      <div id="excelPreviewArea"></div>

      <br>
      <button class="btn-primary" id="submitBtn">送出並計算</button>
      <div class="status-msg" id="statusMsg"></div>
    </div>

    <div id="resultArea"></div>
  </div>

</div>

<script>
  const BACKEND_URL = "https://lego-buying-backend.onrender.com";

  let currentToken = null;

  const extStatusEl = document.getElementById('extStatus');
  const loginBox = document.getElementById('loginBox');
  const appBox = document.getElementById('appBox');
  const loginError = document.getElementById('loginError');
  const userNameLabel = document.getElementById('userNameLabel');
  const statusMsg = document.getElementById('statusMsg');
  const resultArea = document.getElementById('resultArea');
  const submitBtn = document.getElementById('submitBtn');

  // ===== 手動輸入表格 =====
  const manualRows = document.getElementById('manualRows');
  const addRowBtn = document.getElementById('addRowBtn');

  function addManualRow(partNumber = '', color = '', qty = 1) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="text" class="cell-part" placeholder="例如 3001" value="${escapeAttr(partNumber)}"></td>
      <td><input type="text" class="cell-color" placeholder="例如 紅" value="${escapeAttr(color)}"></td>
      <td class="qty-cell"><input type="number" class="cell-qty" min="1" value="${qty}"></td>
      <td class="del-cell"><button type="button" class="row-del-btn" title="刪除">×</button></td>
    `;
    tr.querySelector('.row-del-btn').addEventListener('click', () => tr.remove());
    manualRows.appendChild(tr);
  }

  addRowBtn.addEventListener('click', () => addManualRow());
  // 預設先給兩列方便使用
  addManualRow('3001', '紅', 2);
  addManualRow('3002', '藍', 1);

  function collectManualParts() {
    const parts = [];
    manualRows.querySelectorAll('tr').forEach(tr => {
      const partNumber = tr.querySelector('.cell-part').value.trim();
      const color = tr.querySelector('.cell-color').value.trim() || 'None';
      const qty = parseInt(tr.querySelector('.cell-qty').value, 10) || 1;
      if (partNumber) {
        parts.push({ part_number: partNumber, color, required_qty: qty });
      }
    });
    return parts;
  }

  function escapeAttr(str) {
    return String(str).replace(/"/g, '&quot;');
  }

  // ===== Excel 上傳解析（對應 file_handler.py 的欄位邏輯） =====
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const excelPreviewArea = document.getElementById('excelPreviewArea');
  let parsedExcelParts = [];

  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) handleExcelFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) handleExcelFile(e.target.files[0]);
  });

  function handleExcelFile(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheetName = workbook.SheetNames[0];
        const sheet = workbook.Sheets[firstSheetName];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });

        const result = parseRowsToParts(rows);

        if (result.error) {
          excelPreviewArea.innerHTML = `<div class="banner short">${escapeHtml(result.error)}</div>`;
          parsedExcelParts = [];
          return;
        }

        parsedExcelParts = result.parts;
        renderExcelPreview(file.name, parsedExcelParts);
      } catch (err) {
        excelPreviewArea.innerHTML = `<div class="banner short">檔案讀取失敗：${escapeHtml(err.message)}</div>`;
        parsedExcelParts = [];
      }
    };
    reader.readAsArrayBuffer(file);
  }

  // 對應 file_handler.py 的欄位對應：零件編號→part_number，數量→quantity，顏色→color
  function parseRowsToParts(rows) {
    if (!rows || rows.length === 0) {
      return { error: '檔案內沒有資料' };
    }

    const headers = Object.keys(rows[0]).map(h => h.trim());
    const required = ['零件編號', '數量', '顏色'];
    const missing = required.filter(col => !headers.includes(col));
    if (missing.length > 0) {
      return { error: `檔案缺少必要欄位：${missing.join('、')}` };
    }

    const parts = [];
    for (const row of rows) {
      const partNumber = String(row['零件編號'] ?? '').trim();
      if (!partNumber || partNumber.toLowerCase() === 'nan') continue;

      let qty = parseInt(row['數量'], 10);
      if (isNaN(qty) || qty <= 0) qty = 1;

      let color = String(row['顏色'] ?? '').trim();
      if (!color || color.toLowerCase() === 'nan') color = 'None';

      parts.push({ part_number: partNumber, color, required_qty: qty });
    }

    if (parts.length === 0) {
      return { error: '解析完成，但沒有找到有效的零件資料' };
    }

    return { parts };
  }

  function renderExcelPreview(fileName, parts) {
    const rowsHtml = parts.map(p => `
      <tr>
        <td>${escapeHtml(p.part_number)}</td>
        <td>${escapeHtml(p.color)}</td>
        <td>${p.required_qty}</td>
      </tr>
    `).join('');

    excelPreviewArea.innerHTML = `
      <div class="file-summary">
        <span>已解析 <span class="fname">${escapeHtml(fileName)}</span> · 共 ${parts.length} 筆零件</span>
        <button class="clear-file-btn" id="clearFileBtn">清除重新上傳</button>
      </div>
      <div class="preview-table-wrap">
        <table class="preview-table">
          <thead><tr><th>零件編號</th><th>顏色</th><th>數量</th></tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
    `;

    document.getElementById('clearFileBtn').addEventListener('click', () => {
      parsedExcelParts = [];
      fileInput.value = '';
      excelPreviewArea.innerHTML = '';
    });
  }

  window.addEventListener('message', (event) => {
    if (event.source !== window) return;
    if (event.data?.type === 'LEGO_HELPER_READY') {
      extStatusEl.textContent = '擴充功能：已連接 ✓';
      extStatusEl.classList.add('ok');
    }
  });

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const username = document.getElementById('usernameInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    loginError.textContent = '';

    if (!username || !password) {
      loginError.textContent = '請輸入帳號與密碼';
      return;
    }

    loginError.textContent = '登入中...（若後端剛喚醒可能需要等待較久）';

    try {
      const resp = await fetch(`${BACKEND_URL}/api/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await resp.json();

      if (!resp.ok) {
        loginError.textContent = data.detail || '登入失敗';
        return;
      }

      currentToken = data.token;
      loginError.textContent = '';
      loginBox.style.display = 'none';
      appBox.style.display = 'block';
      userNameLabel.textContent = username;
    } catch (e) {
      loginError.textContent = '連線發生錯誤：' + e.message;
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    if (currentToken) {
      try {
        await fetch(`${BACKEND_URL}/api/logout`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${currentToken}` }
        });
      } catch (e) { /* 忽略 */ }
    }
    currentToken = null;
    appBox.style.display = 'none';
    loginBox.style.display = 'block';
    resultArea.innerHTML = '';
    statusMsg.textContent = '';
  });

  function requestOptimize(parts, token) {
    return new Promise((resolve, reject) => {
      const timeout = setTimeout(() => {
        reject(new Error('逾時：擴充功能沒有回應，請確認是否已安裝並重新整理頁面'));
      }, 60000);

      function handler(event) {
        if (event.data?.type === 'LEGO_HELPER_RESPONSE') {
          clearTimeout(timeout);
          window.removeEventListener('message', handler);
          resolve(event.data.payload);
        }
      }
      window.addEventListener('message', handler);
      window.postMessage({ type: 'LEGO_HELPER_REQUEST', parts, token }, '*');
    });
  }

  // ---- 結果渲染 ----
  function renderResult(result) {
    resultArea.innerHTML = '';

    if (result.status !== 'success') {
      resultArea.innerHTML = `<div class="banner short">計算失敗：${escapeHtml(result.message || result.detail || '未知錯誤')}</div>`;
      return;
    }

    const frag = document.createDocumentFragment();

    // 總計條
    const summary = document.createElement('div');
    summary.className = 'grand-summary';
    summary.innerHTML = `
      <div>
        <div class="label">總金額（含運費）</div>
        <div class="meta">${result.summary.total_sellers} 個賣家 · ${result.summary.total_sellers} 個包裹</div>
      </div>
      <div class="amount">$${Math.round(result.summary.grand_total).toLocaleString()}</div>
    `;
    frag.appendChild(summary);

    // 警告/缺貨提示
    (result.warnings || []).forEach(w => {
      const b = document.createElement('div');
      b.className = 'banner warn';
      b.textContent = `${w.part}：${w.message || JSON.stringify(w)}`;
      frag.appendChild(b);
    });

    const shortageEntries = Object.entries(result.shortage_parts || {});
    shortageEntries.forEach(([part, s]) => {
      const b = document.createElement('div');
      b.className = 'banner short';
      b.textContent = `${part} 庫存不足：需要 ${s.needed}，僅找到 ${s.available}，缺 ${s.missing} 個`;
      frag.appendChild(b);
    });

    if (result.unresolved_parts && result.unresolved_parts.length > 0) {
      const b = document.createElement('div');
      b.className = 'banner short';
      b.textContent = `完全找不到貨源：${result.unresolved_parts.join('、')}`;
      frag.appendChild(b);
    }

    // 依賣家分組的 recommendations
    const bySeller = {};
    (result.recommendations || []).forEach(r => {
      const sid = r.seller_id || 'unknown';
      if (!bySeller[sid]) bySeller[sid] = [];
      bySeller[sid].push(r);
    });

    const sellersInfo = result.sellers || {};

    Object.entries(bySeller).forEach(([sellerId, items]) => {
      const info = sellersInfo[sellerId] || {};
      const crate = document.createElement('div');
      crate.className = 'crate';

      const sellerName = items[0].seller_name || sellerId;

      crate.innerHTML = `
        <div class="crate-head">
          <div>
            <span class="tag">包裹 · ${sellerId}</span>
            <div class="seller">${escapeHtml(sellerName)}</div>
          </div>
        </div>
        <div class="crate-items"></div>
        <div class="crate-foot">
          <span class="breakdown">小計 $${(info.subtotal ?? '-')} + 運費 $${(info.shipping ?? '-')}</span>
          <span class="total">$${(info.total ?? '-')}</span>
        </div>
      `;

      const itemsBox = crate.querySelector('.crate-items');
      items.forEach(it => {
        const row = document.createElement('div');
        row.className = 'item-row';
        const lineTotal = (it.unit_price ?? 0) * (it.packs_bought ?? 1);
        row.innerHTML = `
          <div class="item-main">
            <span class="item-part">${escapeHtml(it.part)}</span>
            <div class="item-title"><a href="${it.url}" target="_blank" rel="noopener">${escapeHtml(it.item_title || '')}</a></div>
            <div class="item-qty">單價 $${it.unit_price} × ${it.pack_qty} 個/包 · 買 ${it.packs_bought} 包</div>
          </div>
          <div class="item-price">$${lineTotal}</div>
        `;
        itemsBox.appendChild(row);
      });

      frag.appendChild(crate);
    });

    if (Object.keys(bySeller).length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = '沒有找到任何可購買的項目';
      frag.appendChild(empty);
    }

    // 原始 JSON（除錯用，收合）
    const details = document.createElement('details');
    details.className = 'raw-json';
    details.innerHTML = `<summary>原始資料（除錯用）</summary><pre>${escapeHtml(JSON.stringify(result, null, 2))}</pre>`;
    frag.appendChild(details);

    resultArea.appendChild(frag);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  submitBtn.addEventListener('click', async () => {
    resultArea.innerHTML = '';

    if (!currentToken) {
      statusMsg.textContent = '請先登入';
      return;
    }

    let parts;
    if (parsedExcelParts.length > 0) {
      parts = parsedExcelParts;
    } else {
      parts = collectManualParts();
      if (parts.length === 0) {
        statusMsg.textContent = '請至少輸入一筆零件編號，或上傳 Excel / CSV 檔案';
        return;
      }
    }

    statusMsg.textContent = `正在收集 ${parts.length} 筆零件資料並計算，請稍候...（第一次可能要等後端喚醒，約 50 秒）`;
    submitBtn.disabled = true;

    try {
      const result = await requestOptimize(parts, currentToken);

      if (result?.status === 'error' && result?.message?.includes('401')) {
        statusMsg.textContent = '登入已失效，請重新登入';
        currentToken = null;
        appBox.style.display = 'none';
        loginBox.style.display = 'block';
        return;
      }

      statusMsg.textContent = '';
      renderResult(result);
    } catch (e) {
      statusMsg.textContent = '發生錯誤：' + e.message;
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
