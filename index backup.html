<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>採購小幫手 · SHOTVAL FOUNDRY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=JetBrains+Mono:wght@300;400;500&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #0D0E11;            /* 深邃石墨黑 */
    --panel: #14161B;         /* 鋼鐵工藝面板 */
    --panel-border: #232730;  /* 沉穩邊線 */
    --ink: #E6E8EC;           /* 純淨鈦白文字 */
    --ink-soft: #7E8494;      /* 低彩度霧灰說明文字 */
    --line: #1E2129;          /* 微細分隔線 */
    --brick: #C94038;         /* 精神點綴朱紅 */
    --brick-dark: #E04840;
    --stud: #D4AF37;          /* 啞光金屬黃 */
    --ok-bg: #122417;
    --ok-ink: #52C472;
    --warn-bg: #2B2011;
    --warn-ink: #E0A845;
    --input-bg: #0A0B0D;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    line-height: 1.6;
    letter-spacing: 0.02em;
  }

  .wrap { 
    max-width: 960px; 
    margin: 0 auto; 
    padding: 60px 24px 100px; 
  }

  header.page-head {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-bottom: 60px;
    padding-top: 40px;
    gap: 16px;
    text-align: center;
  }

  .brand-tag {
    font-family: 'Cinzel', serif;
    font-size: 36px;
    font-weight: 600;
    letter-spacing: 0.25em;
    color: var(--ink);
    opacity: 1;
    margin-bottom: 4px;
    text-transform: none;
  }

  h1 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 300;
    font-size: 36px;
    letter-spacing: 0.22em;
    margin: 0;
    color: var(--ink-soft);
  }

  .ext-status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    letter-spacing: 0.12em;
    padding: 6px 18px;
    border-radius: 20px;
    background: transparent;
    border: 1px solid var(--panel-border);
    color: var(--ink-soft);
  }
  .ext-status.ok { 
    color: var(--ok-ink); 
    background: var(--ok-bg); 
    border-color: rgba(82, 196, 114, 0.2); 
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 48px 56px;
    margin-bottom: 32px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.5);
  }

  .panel h2 {
    font-family: 'Cinzel', serif;
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 28px;
    text-transform: uppercase;
    letter-spacing: 0.25em;
    color: var(--ink);
    opacity: 0.9;
  }

  .row { 
    display: flex; 
    flex-direction: column; 
    gap: 24px; 
    margin-bottom: 32px; 
  }
  .row > div { width: 100%; }

  label.field-label {
    display: block;
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 12px;
    letter-spacing: 0.08em;
  }

  input[type="text"], input[type="password"], input[type="number"], textarea {
    width: 100%;
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    padding: 14px 18px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--input-bg);
    color: var(--ink);
    transition: all 0.2s ease;
  }
  textarea { min-height: 140px; resize: vertical; }
  input:focus, textarea:focus { 
    outline: none;
    border-color: var(--ink-soft); 
  }

  .pwd-wrap {
    position: relative;
    width: 100%;
  }
  .pwd-wrap input {
    padding-right: 52px;
  }

  .pwd-toggle {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent !important;
    border: none !important;
    outline: none !important;
    color: var(--ink-soft);
    cursor: pointer;
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    transition: color 0.2s;
  }
  .pwd-toggle:hover {
    color: var(--ink);
  }

  button {
    font-family: 'Plus Jakarta Sans', sans-serif;
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-primary { 
    background: var(--ink); 
    color: var(--bg); 
    font-size: 15px;
    font-weight: 500;
    padding: 12px 24px;
    letter-spacing: 0.08em;
    border-radius: 6px;
  }
  .btn-primary:hover { 
    background: #FFFFFF; 
    opacity: 0.95;
  }
  .btn-primary:disabled { 
    background: #252830; 
    color: #525766; 
    cursor: not-allowed; 
  }
  .btn-ghost { 
    background: transparent; 
    color: var(--ink-soft); 
    border: 1px solid var(--line); 
    padding: 8px 16px;
    font-size: 13px;
    border-radius: 4px;
  }
  .btn-ghost:hover { border-color: var(--ink-soft); color: var(--ink); }
  .error-msg { color: var(--brick); font-size: 13px; margin-top: 16px; }
  .status-msg { color: var(--ink-soft); font-size: 13px; margin: 16px 0; }
  .login-status {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
    font-size: 15px;
    color: var(--ink-soft);
    letter-spacing: 0.05em;
  }

  .spinner {
    width: 18px;
    height: 18px;
    border: 2px solid var(--panel-border);
    border-top-color: var(--ink);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .user-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    font-size: 13px;
    color: var(--ink-soft);
    letter-spacing: 0.05em;
  }
  .user-bar strong { color: var(--ink); font-family: 'JetBrains Mono', monospace; }

  #appBox { display: none; }

  table.parts-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
  table.parts-table th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    padding: 0 8px 10px;
    font-weight: 600;
  }
  table.parts-table td { padding: 6px 4px; }
  table.parts-table td.qty-cell input { text-align: center; }
  table.parts-table td.del-cell { width: 40px; text-align: center; }
  
  .row-del-btn {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 18px;
    cursor: pointer;
    padding: 4px 8px;
    transition: color 0.2s;
  }
  .row-del-btn:hover { color: var(--brick); }
  .add-row-btn {
    background: transparent;
    border: 1px dashed var(--panel-border);
    color: var(--ink-soft);
    width: 100%;
    padding: 12px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 20px;
  }
  .add-row-btn:hover { border-color: var(--ink-soft); color: var(--ink); background: var(--input-bg); }
  .or-divider {
    display: flex;
    align-items: center;
    text-align: center;
    color: var(--ink-soft);
    font-size: 12px;
    margin: 28px 0;
    letter-spacing: 0.1em;
  }
  .or-divider::before, .or-divider::after {
    content: '';
    flex: 1;
    border-bottom: 1px solid var(--line);
  }
  .or-divider span { padding: 0 16px; }
  .drop-zone {
    border: 2px dashed var(--panel-border);
    border-radius: 8px;
    padding: 36px 20px;
    text-align: center;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 13px;
    background: var(--input-bg);
    transition: all 0.2s ease;
  }
  .drop-zone:hover, .drop-zone.dragover { border-color: var(--stud); background: #181A20; }
  .drop-zone strong { color: var(--ink); }
  .drop-zone input[type="file"] { display: none; }
  .preview-table-wrap { max-height: 260px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; margin-top: 12px; margin-bottom: 16px; }
  table.preview-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.preview-table th {
    position: sticky; top: 0;
    background: #101216;
    text-align: left;
    padding: 10px 14px;
    font-size: 11px;
    text-transform: uppercase;
    color: var(--ink-soft);
    border-bottom: 1px solid var(--line);
    letter-spacing: 0.05em;
  }
  table.preview-table td { padding: 8px 14px; border-bottom: 1px solid var(--line); font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink); }
  table.preview-table tr:last-child td { border-bottom: none; }

  .file-summary { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-top: 16px; margin-bottom: 8px; color: var(--ink-soft); }
  .file-summary .fname { font-weight: 600; color: var(--ink); }
  .clear-file-btn { background: none; border: none; color: var(--ink-soft); text-decoration: underline; cursor: pointer; font-size: 12px; padding: 0; }
  .clear-file-btn:hover { color: var(--brick); }
  .grand-summary {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #000000;
    color: white;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 24px 28px;
    margin: 32px 0 24px;
  }
  .grand-summary .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; opacity: 0.6; }
  .grand-summary .amount { font-family: 'JetBrains Mono', monospace; font-size: 32px; font-weight: 500; color: var(--stud); }
  .grand-summary .meta { font-size: 11px; opacity: 0.7; margin-top: 4px; }
  .crate {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .crate-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    background: #101216;
    border-bottom: 1px solid var(--line);
  }
  .crate-head .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    background: var(--stud);
    color: #0D0E11;
    padding: 2px 8px;
    border-radius: 2px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }
  .crate-head .seller {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 600;
    font-size: 14px;
    margin-top: 6px;
    color: var(--ink);
  }

  .crate-items { padding: 8px 24px; }
  .item-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }
  .item-row:last-child { border-bottom: none; }
  .item-main { flex: 1; min-width: 0; }
  .item-part {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    background: #1E2129;
    display: inline-block;
    padding: 2px 8px;
    border-radius: 3px;
    margin-bottom: 6px;
  }
  .item-title {
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .item-title a { color: var(--ink); text-decoration: none; transition: color 0.2s; }
  .item-title a:hover { color: var(--ink-soft); text-decoration: underline; }
  .item-qty { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
  .item-price {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 14px;
    white-space: nowrap;
  }

  .crate-foot {
    display: flex;
    justify-content: space-between;
    padding: 14px 24px;
    background: var(--input-bg);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    border-top: 1px solid var(--line);
  }
  .crate-foot .total { font-weight: 600; font-size: 14px; color: var(--ink); }
  .crate-foot .breakdown { color: var(--ink-soft); }
  .banner {
    border-radius: 6px;
    padding: 14px 18px;
    font-size: 12px;
    margin-bottom: 16px;
    letter-spacing: 0.02em;
  }
  .banner.warn { background: var(--warn-bg); color: var(--warn-ink); border: 1px solid #4D381A; }
  .banner.short { background: #2B1416; color: #FF9B9E; border: 1px solid #522023; }

  details.raw-json { margin-top: 24px; font-size: 11px; color: var(--ink-soft); }
  details.raw-json pre {
    background: var(--input-bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 16px;
    overflow-x: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    white-space: pre-wrap;
    color: var(--ink-soft);
  }

  .empty-state { text-align: center; color: var(--ink-soft); padding: 40px 0; font-size: 12px; letter-spacing: 0.05em; }
</style>
</head>
<body>
<div class="wrap">

  <header class="page-head">
    <div class="brand-tag">Shotval Foundry</div>
    <h1>採購小幫手</h1>
    <span class="ext-status" id="extStatus">擴充功能：尚未偵測到</span>
  </header>

  <div class="panel" id="loginBox">
    <h2>SYSTEM ACCESS</h2>
    <div class="row">
      <div>
        <label class="field-label" for="usernameInput">帳號</label>
        <input type="text" id="usernameInput" autocomplete="username">
      </div>
      <div>
        <label class="field-label" for="passwordInput">密碼</label>
        <div class="pwd-wrap">
          <input type="password" id="passwordInput" autocomplete="current-password">
          <button type="button" class="pwd-toggle" id="togglePwdBtn" aria-label="切換密碼顯示">
            <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>
    </div>
    <button class="btn-primary" id="loginBtn">登入</button>
    <div class="error-msg" id="loginError"></div>
  </div>

  <div id="appBox">
    <div class="user-bar">
      <div>OPERATOR: <strong id="userNameLabel"></strong></div>
      <button class="btn-ghost" id="logoutBtn">登出</button>
    </div>

    <div class="panel">
      <h2>PARTS LIST</h2>
      <label class="field-label">手動輸入</label>
      <table class="parts-table">
        <thead>
          <tr>
            <th style="width:32%">零件編號</th>
            <th style="width:32%">顏色</th>
            <th style="width:20%">數量</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="manualRows"></tbody>
      </table>
      <button class="add-row-btn" id="addRowBtn">+ 新增一列</button>
      <div class="or-divider"><span>OR</span></div>
      <label class="field-label">上傳 EXCEL / CSV（若上傳檔案，將優先採用檔案內容）</label>
      <div class="drop-zone" id="dropZone">
        <div><strong>點擊選擇檔案</strong>，或將 Excel / CSV 拖曳到這裡</div>
        <div style="margin-top:6px; font-size:12px; color: var(--ink-soft);">需包含欄位：零件編號、數量、顏色</div>
        <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
      </div>
      <div id="excelPreviewArea"></div>

      <br><br>
      <button class="btn-primary" id="submitBtn">送出並計算</button>
      <div class="status-msg" id="statusMsg"></div>
    </div>
    <div id="resultArea"></div>
  </div>

</div>

<script>
  const BACKEND_URL = "https://lego-buying-backend.onrender.com";
  let currentToken = null;

  const extStatusEl = document.getElementById('extStatus');
  const loginBox = document.getElementById('loginBox');
  const appBox = document.getElementById('appBox');
  const loginError = document.getElementById('loginError');
  const userNameLabel = document.getElementById('userNameLabel');
  const statusMsg = document.getElementById('statusMsg');
  const resultArea = document.getElementById('resultArea');
  const submitBtn = document.getElementById('submitBtn');

  document.addEventListener('DOMContentLoaded', () => {
    const passwordInput = document.getElementById('passwordInput');
    const togglePwdBtn = document.getElementById('togglePwdBtn');
    const eyeIcon = document.getElementById('eyeIcon');

    if (togglePwdBtn && passwordInput) {
      togglePwdBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();

        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';

        eyeIcon.innerHTML = isPassword
          ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`
          : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
      });
    }
  });

  const manualRows = document.getElementById('manualRows');
  const addRowBtn = document.getElementById('addRowBtn');

  function addManualRow(partNumber = '', color = '', qty = 1) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="text" class="cell-part" placeholder="例如 3001" value="${escapeAttr(partNumber)}"></td>
      <td><input type="text" class="cell-color" placeholder="例如 紅" value="${escapeAttr(color)}"></td>
      <td class="qty-cell"><input type="number" class="cell-qty" min="1" value="${qty}"></td>
      <td class="del-cell"><button type="button" class="row-del-btn" title="刪除">×</button></td>
    `;
    tr.querySelector('.row-del-btn').addEventListener('click', () => tr.remove());
    manualRows.appendChild(tr);
  }

  addRowBtn.addEventListener('click', () => addManualRow());
  addManualRow('3001', '紅', 2);
  addManualRow('3002', '藍', 1);

  function collectManualParts() {
    const parts = [];
    manualRows.querySelectorAll('tr').forEach(tr => {
      const partNumber = tr.querySelector('.cell-part').value.trim();
      const color = tr.querySelector('.cell-color').value.trim() || 'None';
      const qty = parseInt(tr.querySelector('.cell-qty').value, 10) || 1;
      if (partNumber) {
        parts.push({ part_number: partNumber, color, required_qty: qty });
      }
    });
    return parts;
  }

  function escapeAttr(str) {
    return String(str).replace(/"/g, '&quot;');
  }

  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const excelPreviewArea = document.getElementById('excelPreviewArea');
  let parsedExcelParts = [];

  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) handleExcelFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) handleExcelFile(e.target.files[0]);
  });

  function handleExcelFile(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheetName = workbook.SheetNames[0];
        const sheet = workbook.Sheets[firstSheetName];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
        const result = parseRowsToParts(rows);

        if (result.error) {
          excelPreviewArea.innerHTML = `<div class="banner short">${escapeHtml(result.error)}</div>`;
          parsedExcelParts = [];
          return;
        }

        parsedExcelParts = result.parts;
        renderExcelPreview(file.name, parsedExcelParts);
      } catch (err) {
        excelPreviewArea.innerHTML = `<div class="banner short">檔案讀取失敗：${escapeHtml(err.message)}</div>`;
        parsedExcelParts = [];
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function parseRowsToParts(rows) {
    if (!rows || rows.length === 0) {
      return { error: '檔案內沒有資料' };
    }

    const headers = Object.keys(rows[0]).map(h => h.trim());
    const required = ['零件編號', '數量', '顏色'];
    const missing = required.filter(col => !headers.includes(col));
    if (missing.length > 0) {
      return { error: `檔案缺少必要欄位：${missing.join('、')}` };
    }

    const parts = [];
    for (const row of rows) {
      const partNumber = String(row['零件編號'] ?? '').trim();
      if (!partNumber || partNumber.toLowerCase() === 'nan') continue;

      let qty = parseInt(row['數量'], 10);
      if (isNaN(qty) || qty <= 0) qty = 1;

      let color = String(row['顏色'] ?? '').trim();
      if (!color || color.toLowerCase() === 'nan') color = 'None';

      parts.push({ part_number: partNumber, color, required_qty: qty });
    }

    if (parts.length === 0) {
      return { error: '解析完成，但沒有找到有效的零件資料' };
    }

    return { parts };
  }

  function renderExcelPreview(fileName, parts) {
    const rowsHtml = parts.map(p => `
      <tr>
        <td>${escapeHtml(p.part_number)}</td>
        <td>${escapeHtml(p.color)}</td>
        <td>${p.required_qty}</td>
      </tr>
    `).join('');

    excelPreviewArea.innerHTML = `
      <div class="file-summary">
        <span>已解析 <span class="fname">${escapeHtml(fileName)}</span> · 共 ${parts.length} 筆零件</span>
        <button class="clear-file-btn" id="clearFileBtn">清除重新上傳</button>
      </div>
      <div class="preview-table-wrap">
        <table class="preview-table">
          <thead><tr><th>零件編號</th><th>顏色</th><th>數量</th></tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
    `;

    document.getElementById('clearFileBtn').addEventListener('click', () => {
      parsedExcelParts = [];
      fileInput.value = '';
      excelPreviewArea.innerHTML = '';
    });
  }

  window.addEventListener('message', (event) => {
    if (event.source !== window) return;
    if (event.data?.type === 'LEGO_HELPER_READY') {
      extStatusEl.textContent = '擴充功能：已連接 ✓';
      extStatusEl.classList.add('ok');
    }
  });

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const username = document.getElementById('usernameInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    
    loginError.className = 'login-status';
    loginError.innerHTML = '';

    if (!username || !password) {
      loginError.style.color = 'var(--brick)';
      loginError.textContent = '請輸入帳號與密碼';
      return;
    }

    loginError.style.color = 'var(--ink-soft)';
    loginError.innerHTML = `<span class="spinner"></span><span>登入中...</span>`;

    try {
      const resp = await fetch(`${BACKEND_URL}/api/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await resp.json();

      if (!resp.ok) {
        loginError.style.color = 'var(--brick)';
        loginError.textContent = data.detail || '登入失敗';
        return;
      }

      currentToken = data.token;
      loginError.innerHTML = '';
      loginBox.style.display = 'none';
      appBox.style.display = 'block';
      userNameLabel.textContent = username;
    } catch (e) {
      loginError.style.color = 'var(--brick)';
      loginError.textContent = '連線發生錯誤：' + e.message;
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    if (currentToken) {
      try {
        await fetch(`${BACKEND_URL}/api/logout`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${currentToken}` }
        });
      } catch (e) { /* 忽略 */ }
    }
    currentToken = null;
    appBox.style.display = 'none';
    loginBox.style.display = 'block';
    resultArea.innerHTML = '';
    statusMsg.textContent = '';
  });

  function requestOptimize(parts, token) {
    return new Promise((resolve, reject) => {
      const timeout = setTimeout(() => {
        reject(new Error('逾時：擴充功能沒有回應，請確認是否已安裝並重新整理頁面'));
      }, 60000);

      function handler(event) {
        if (event.data?.type === 'LEGO_HELPER_RESPONSE') {
          clearTimeout(timeout);
          window.removeEventListener('message', handler);
          resolve(event.data.payload);
        }
      }
      window.addEventListener('message', handler);
      window.postMessage({ type: 'LEGO_HELPER_REQUEST', parts, token }, '*');
    });
  }

  function renderResult(result) {
    resultArea.innerHTML = '';

    if (result.status !== 'success') {
      resultArea.innerHTML = `<div class="banner short">計算失敗：${escapeHtml(result.message || result.detail || '未知錯誤')}</div>`;
      return;
    }

    const frag = document.createDocumentFragment();
    const summary = document.createElement('div');
    summary.className = 'grand-summary';
    summary.innerHTML = `
      <div>
        <div class="label">總金額（含運費）</div>
        <div class="meta">${result.summary.total_sellers} 個賣家 · ${result.summary.total_sellers} 個包裹</div>
      </div>
      <div class="amount">$${Math.round(result.summary.grand_total).toLocaleString()}</div>
    `;
    frag.appendChild(summary);

    (result.warnings || []).forEach(w => {
      const b = document.createElement('div');
      b.className = 'banner warn';
      b.textContent = `${w.part}：${w.message || JSON.stringify(w)}`;
      frag.appendChild(b);
    });

    const shortageEntries = Object.entries(result.shortage_parts || {});
    shortageEntries.forEach(([part, s]) => {
      const b = document.createElement('div');
      b.className = 'banner short';
      b.textContent = `${part} 庫存不足：需要 ${s.needed}，僅找到 ${s.available}，缺 ${s.missing} 個`;
      frag.appendChild(b);
    });

    if (result.unresolved_parts && result.unresolved_parts.length > 0) {
      const b = document.createElement('div');
      b.className = 'banner short';
      b.textContent = `完全找不到貨源：${result.unresolved_parts.join('、')}`;
      frag.appendChild(b);
    }

    const bySeller = {};
    (result.recommendations || []).forEach(r => {
      const sid = r.seller_id || 'unknown';
      if (!bySeller[sid]) bySeller[sid] = [];
      bySeller[sid].push(r);
    });

    const sellersInfo = result.sellers || {};

    Object.entries(bySeller).forEach(([sellerId, items]) => {
      const info = sellersInfo[sellerId] || {};
      const crate = document.createElement('div');
      crate.className = 'crate';

      const sellerName = items[0].seller_name || sellerId;

      crate.innerHTML = `
        <div class="crate-head">
          <div>
            <span class="tag">包裹 · ${sellerId}</span>
            <div class="seller">${escapeHtml(sellerName)}</div>
          </div>
        </div>
        <div class="crate-items"></div>
        <div class="crate-foot">
          <span class="breakdown">小計 $${(info.subtotal ?? '-')} + 運費 $${(info.shipping ?? '-')}</span>
          <span class="total">$${(info.total ?? '-')}</span>
        </div>
      `;

      const itemsBox = crate.querySelector('.crate-items');
      items.forEach(it => {
        const row = document.createElement('div');
        row.className = 'item-row';
        const lineTotal = (it.unit_price ?? 0) * (it.packs_bought ?? 1);
        row.innerHTML = `
          <div class="item-main">
            <span class="item-part">${escapeHtml(it.part)}</span>
            <div class="item-title"><a href="${it.url}" target="_blank" rel="noopener">${escapeHtml(it.item_title || '')}</a></div>
            <div class="item-qty">單價 $${it.unit_price} × ${it.pack_qty} 個/包 · 買 ${it.packs_bought} 包</div>
          </div>
          <div class="item-price">$${lineTotal}</div>
        `;
        itemsBox.appendChild(row);
      });

      frag.appendChild(crate);
    });

    if (Object.keys(bySeller).length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = '沒有找到任何可購買的項目';
      frag.appendChild(empty);
    }

    const details = document.createElement('details');
    details.className = 'raw-json';
    details.innerHTML = `<summary>原始資料（除錯用）</summary><pre>${escapeHtml(JSON.stringify(result, null, 2))}</pre>`;
    frag.appendChild(details);

    resultArea.appendChild(frag);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  submitBtn.addEventListener('click', async () => {
    resultArea.innerHTML = '';

    if (!currentToken) {
      statusMsg.textContent = '請先登入';
      return;
    }

    let parts;
    if (parsedExcelParts.length > 0) {
      parts = parsedExcelParts;
    } else {
      parts = collectManualParts();
      if (parts.length === 0) {
        statusMsg.textContent = '請至少輸入一筆零件編號，或上傳 Excel / CSV 檔案';
        return;
      }
    }

    statusMsg.textContent = `正在收集 ${parts.length} 筆零件資料並計算，請稍候...（第一次可能要等後端喚醒，約 50 秒）`;
    submitBtn.disabled = true;

    try {
      const result = await requestOptimize(parts, currentToken);

      if (result?.status === 'error' && result?.message?.includes('401')) {
        statusMsg.textContent = '登入已失效，請重新登入';
        currentToken = null;
        appBox.style.display = 'none';
        loginBox.style.display = 'block';
        return;
      }

      statusMsg.textContent = '';
      renderResult(result);
    } catch (e) {
      statusMsg.textContent = '發生錯誤：' + e.message;
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
